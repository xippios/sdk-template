# Copier template for xippios-<source> repositories. Questions first; copier settings
# (keys starting with "_") at the end. See README.md for how to use it.

source_slug:
  type: str
  help: >-
    Source slug: the provider and, where one provider has several APIs, the API.
    Becomes repo sdk-<slug>, distribution xippios-<slug> and import xippios.<slug_with_underscores>.
  placeholder: usda-nass
  validator: >-
    {% if not (source_slug | regex_search('^[a-z0-9]+(-[a-z0-9]+)*$')) %}
    Use lowercase letters, digits and single hyphens, e.g. usda-nass
    {% endif %}

import_path:
  type: str
  help: >-
    Import path under xippios. A provider with several APIs nests (usda-nass → usda.nass);
    a single-API provider stays flat. Override only when a single-API provider's name
    carries a hyphen (world-bank → world_bank). See conventions §1 and ADR-0006.
  default: "{{ source_slug | replace('-', '.') }}"
  validator: >-
    {% if not (import_path | regex_search('^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$')) %}
    Dotted lowercase identifiers only, e.g. usda.nass or comtrade
    {% endif %}

package_dir:
  type: str
  default: "{{ import_path | replace('.', '/') }}"
  when: false

tool_prefix:
  type: str
  default: "{{ source_slug | replace('-', '_') }}"
  when: false

# When the nightly live.yml starts: a fold of the slug's characters onto the 300 minutes
# from 01:00 to 05:59 UTC, so sources that share a key (ADR-0009) do not start together
# and each repository keeps its time across updates. Computed, never recorded; the
# generated live.yml and CLAUDE.md read .cron and .time.
live_schedule:
  type: yaml
  default: >-
    {%- set ns = namespace(n=0) -%}
    {%- for c in source_slug -%}
    {%- set ns.n = (ns.n * 37 + 'abcdefghijklmnopqrstuvwxyz0123456789-'.index(c) + 1) % 300 -%}
    {%- endfor -%}
    {cron: "{{ ns.n % 60 }} {{ 1 + ns.n // 60 }} * * *",
    time: "{{ '%02d:%02d' | format(1 + ns.n // 60, ns.n % 60) }}"}
  when: false

source_name:
  type: str
  help: >-
    Human-readable name of the source, at most 77 characters: the generated Python puts
    it on a line, the longest of them http.py's first, which ruff keeps within 100
    columns; no double quote or backslash, since the generated Python quotes it
  placeholder: USDA NASS Quick Stats
  validator: >-
    {% if not source_name %}Required{% elif source_name | length > 77 %}
    At most 77 characters, so every generated Python line stays within 100 columns
    {% elif '"' in source_name or '\\' in source_name %}
    No double quote and no backslash: the generated Python quotes the name
    {% endif %}

upstream_url:
  type: str
  help: The provider's page for this API; linked from the README
  placeholder: https://quickstats.nass.usda.gov
  validator: "{% if not upstream_url.startswith('https://') %}Must start with https://{% endif %}"

upstream_docs_url:
  type: str
  help: Where the API documentation lives; /refresh-upstream snapshots it into docs/upstream/
  placeholder: https://quickstats.nass.usda.gov/api
  validator: "{% if not upstream_docs_url.startswith('https://') %}Must start with https://{% endif %}"

api_base_url:
  type: str
  help: Base URL that request paths are joined onto; usually not the provider page
  placeholder: https://quickstats.nass.usda.gov/api
  validator: "{% if not api_base_url.startswith('https://') %}Required; must start with https://{% endif %}"

# The gateway decides the three key answers below: behind api.data.gov they are derived,
# never asked (ask is false), and still recorded, so the rendered files read them as for
# any keyed source; their validators refuse another value. A `when` would derive them too,
# but copier records no answer of a question whose `when` is false.
gateway:
  type: str
  help: >-
    The shared gateway the API sits behind: api.data.gov for an agency API it fronts
    (USDA FAS's PSD, ESR and GATS), whose key, documented error answers and hourly quota
    come from xippios.core.data_gov, core 0.3.0 on (ADR-0009); the key answers then follow
    from it, DATA_GOV_API_KEY in the X-Api-Key header, and are not asked. none, the
    default, for every other API.
  choices:
    - none
    - api.data.gov
  default: none

api_key_env:
  type: str
  help: Environment variable holding the API key, e.g. NASS_API_KEY. Leave empty if the API needs no key.
  default: "{{ 'DATA_GOV_API_KEY' if gateway == 'api.data.gov' else '' }}"  # pragma: allowlist secret
  ask: "{{ gateway == 'none' }}"
  validator: >-
    {% if api_key_env and not (api_key_env | regex_search('^[A-Z][A-Z0-9_]*_API_KEY$')) %}
    Use UPPER_SNAKE_CASE ending in _API_KEY, e.g. NASS_API_KEY
    {% elif gateway == 'api.data.gov' and api_key_env != 'DATA_GOV_API_KEY' %}
    Behind api.data.gov the key is DATA_GOV_API_KEY (ADR-0009): leave it to the gateway answer
    {% endif %}

api_key_location:
  type: str
  help: How the key is sent
  choices:
    query parameter: query
    request header: header
    bearer token in the Authorization header: bearer
  default: "{{ 'header' if gateway == 'api.data.gov' else 'query' }}"
  when: "{{ api_key_env != '' }}"
  ask: "{{ gateway == 'none' }}"
  validator: >-
    {% if gateway == 'api.data.gov' and api_key_location != 'header' %}
    Behind api.data.gov the key goes in a header (ADR-0009): leave it to the gateway answer
    {% endif %}

api_key_name:
  type: str
  help: Name of the query parameter or header that carries the key
  default: "{{ 'key' if api_key_location == 'query' else 'X-Api-Key' }}"  # pragma: allowlist secret
  when: "{{ api_key_env != '' and api_key_location in ['query', 'header'] }}"
  ask: "{{ gateway == 'none' }}"
  validator: >-
    {% if gateway == 'api.data.gov' and api_key_name != 'X-Api-Key' %}
    Behind api.data.gov the header is X-Api-Key (ADR-0009): leave it to the gateway answer
    {% endif %}

rate_limit_per_minute:
  type: int
  help: >-
    The pace in requests per minute, enforced client-side: the upstream's documented
    per-minute limit (or its per-second limit times 60), or, where upstream documents no
    per-second or per-minute limit, a self-imposed pace, an hourly or daily quota
    notwithstanding (ADR-0010 decision 1)
  default: 60
  validator: "{% if rate_limit_per_minute < 1 %}Must be at least 1{% endif %}"

rate_limit_burst:
  type: int
  help: >-
    Requests the limiter lets through at once before it paces them. 1 unless the
    upstream documents a burst (ADR-0010 decision 1)
  default: 1
  validator: "{% if rate_limit_burst < 1 %}Must be at least 1{% endif %}"

rate_limit_provenance:
  type: str
  help: Where the pace comes from; the generated CLAUDE.md names it (ADR-0010 decision 1)
  choices:
    documented by upstream: documented
    self-imposed, upstream documents no per-second or per-minute limit: self-imposed
  default: documented

core_version:
  type: str
  help: >-
    The xippios-core release the package depends on, X.Y.Z, rendered as the bound
    xippios-core~=X.Y.Z, the extras likewise: one core minor, from that release on
    (conventions §12, ADR-0018). Z is 0 unless patch Z shipped what the source adopts
    (ADR-0018 amendment (c)): the default 0.2.1 is that case, since core 0.2.1 shipped
    the family check that tests/test_family.py imports. A source raises it in the
    adoption PR of a new core minor (conventions §15).
  default: "0.2.1"
  validator: >-
    {% if not (core_version | regex_search('^\\d+\\.\\d+\\.\\d+\\Z')) %}
    Use a release version, e.g. 0.2.0
    {% elif gateway == 'api.data.gov' and (core_version.split('.')[:2] | map('int') | list) < [0, 3] %}
    Behind api.data.gov use 0.3.0 or later: core 0.3.0 brought xippios.core.data_gov
    {% endif %}

core_git_ref:
  type: str
  help: >-
    Development only. The sdk-core commit to depend on for a core change that is not
    released yet: main, or the full 40-character SHA of a commit on main, which uv and
    the merge-class check read as that commit. Leave it empty, the default, for no pin;
    a release carries none (/release-prep removes it first, in a PR of its own).
  default: ""
  validator: >-
    {% if core_git_ref and not (core_git_ref | regex_search('^(main|[0-9a-f]{40})\\Z')) %}
    Use main or a full 40-character lowercase commit SHA of sdk-core, or leave it empty
    {% endif %}

# A string holding a YAML flow list, not a yaml-typed answer: copier records a string on
# one line, '[]' at the default, which the merge classes read as the question's literal
# default (rule 2), where a list would be recorded as [] or as block lines at column 0,
# outside the subset of YAML the classifier reads. depends_on below is the parsed list.
source_dependencies:
  type: str
  help: >-
    The source packages this one depends on, using their task layer only (ADR-0021): a
    YAML flow list of {name: <slug>, minor: "X.Y", key_env: <VAR or "">} entries, e.g.
    [{name: usda-esmis, minor: "0.1", key_env: ""}]. name is the dependency's slug, its
    package xippios-<slug>, imported under xippios as that package's import path; minor,
    in quotes, is the minor depended on, rendered as the bound xippios-<slug>~=X.Y.0
    (conventions §12); key_env is the dependency's key variable, empty for an open API,
    which the offline tests set to the placeholder and live.yml passes from its org secret.
    One level, no cycles: a dependency depends on no other source. The default [] for none.
  default: "[]"
  validator: >-
    {% set deps = source_dependencies | from_yaml %}
    {% set ns = namespace(error='', seen=[]) %}
    {% if deps is string or deps is mapping or deps is not sequence %}
    {% set ns.error = 'A YAML flow list, e.g. [{name: usda-esmis, minor: "0.1", key_env: ""}], or [] for none' %}
    {% else %}
    {% for dep in deps %}
    {% if ns.error %}
    {% elif dep is not mapping or dep | list | sort != ['key_env', 'minor', 'name'] %}
    {% set ns.error = 'Each entry has exactly name, minor and key_env' %}
    {% elif dep['name'] is not string or not (dep['name'] | regex_search('^[a-z0-9]+(-[a-z0-9]+)*\\Z')) %}
    {% set ns.error = 'name: the dependency slug, lowercase letters, digits and single hyphens' %}
    {% elif dep['name'] in [source_slug, 'core'] or dep['name'] in ns.seen %}
    {% set ns.error = 'name: another source, each once; neither this source nor core' %}
    {% elif dep['minor'] is not string or not (dep['minor'] | regex_search('^\\d+\\.\\d+\\Z')) %}
    {% set ns.error = 'minor: X.Y in quotes, e.g. "0.1"; YAML reads 0.10 unquoted as the number 0.1' %}
    {% elif dep['key_env'] is not string or (dep['key_env'] and not (dep['key_env'] | regex_search('^[A-Z][A-Z0-9_]*_API_KEY\\Z'))) %}
    {% set ns.error = 'key_env: UPPER_SNAKE_CASE ending in _API_KEY, or "" for an open API' %}
    {% else %}
    {% set ns.seen = ns.seen + [dep['name']] %}
    {% endif %}
    {% endfor %}
    {% endif %}
    {{ ns.error }}

# The dependencies as a list, parsed from the answer; the rendered files read this.
depends_on:
  type: yaml
  default: "{{ source_dependencies }}"
  when: false

# Every key variable the package's tests and live run need, the source's own first, then
# its dependencies', each once: the placeholder in offline tests, the secrets in live.yml.
key_envs:
  type: yaml
  default: >-
    {{ ((([api_key_env] if api_key_env else []) + depends_on | map(attribute='key_env')
    | select | list) | unique | list) | tojson }}
  when: false

# 9.19.0 brought `ask`, which the key answers take behind a gateway.
_min_copier_version: "9.19.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_envops:
  trim_blocks: true
  lstrip_blocks: true
# Files a session fills with source-specific content: never overwritten by `copier update`.
# Every other rendered file is the template's and updates with it, .claude/family.md,
# tests/conftest.py and tests/test_family.py among them. Copier renders these
# patterns, so those inside the package name its directory: src/xippios/**/api/** would
# also match the whole package of a slug ending in -api (example-api's xippios/example/api/).
_skip_if_exists:
  - src/xippios/{{ package_dir }}/__init__.py
  - src/xippios/{{ package_dir }}/_client.py
  - src/xippios/{{ package_dir }}/errors.py
  - src/xippios/{{ package_dir }}/models.py
  - src/xippios/{{ package_dir }}/api/**
  - src/xippios/{{ package_dir }}/tasks.py
  - src/xippios/{{ package_dir }}/params.py
  - src/xippios/{{ package_dir }}/enums.py
  - src/xippios/{{ package_dir }}/reference/**
  - scripts/**
  - tests/test_tasks.py
  - tests/test_live.py
  - tests/fixtures/**
  - docs/upstream/**
  - README.md
  - CHANGELOG.md
  - CLAUDE.md
