# Copier template for xippios-<source> repositories. Questions first; copier settings
# (keys starting with "_") at the end. See README.md for how to use it.

source_slug:
  type: str
  help: >-
    Source slug: the provider and, where one provider has several APIs, the API.
    Becomes repo sdk-<slug>, distribution xippios-<slug> and import xippios.<slug_with_underscores>.
  placeholder: usda-nass
  validator: >-
    {% if not (source_slug | regex_search('^[a-z0-9]+(-[a-z0-9]+)*$')) %}
    Use lowercase letters, digits and single hyphens, e.g. usda-nass
    {% endif %}

import_path:
  type: str
  help: >-
    Import path under xippios. A provider with several APIs nests (usda-nass → usda.nass);
    a single-API provider stays flat. Override only when a single-API provider's name
    carries a hyphen (world-bank → world_bank). See conventions §1 and sdk-core ADR-0006.
  default: "{{ source_slug | replace('-', '.') }}"
  validator: >-
    {% if not (import_path | regex_search('^[a-z][a-z0-9_]*(\\.[a-z][a-z0-9_]*)*$')) %}
    Dotted lowercase identifiers only, e.g. usda.nass or comtrade
    {% endif %}

package_dir:
  type: str
  default: "{{ import_path | replace('.', '/') }}"
  when: false

tool_prefix:
  type: str
  default: "{{ source_slug | replace('-', '_') }}"
  when: false

# When the nightly live.yml starts: a fold of the slug's characters onto the 300 minutes
# from 01:00 to 05:59 UTC, so sources that share a key (sdk-core ADR-0032) do not start
# together and each repository keeps its time across updates. Computed, never recorded; the
# generated live.yml and CLAUDE.md read .cron and .time.
live_schedule:
  type: yaml
  default: >-
    {%- set ns = namespace(n=0) -%}
    {%- for c in source_slug -%}
    {%- set ns.n = (ns.n * 37 + 'abcdefghijklmnopqrstuvwxyz0123456789-'.index(c) + 1) % 300 -%}
    {%- endfor -%}
    {cron: "{{ ns.n % 60 }} {{ 1 + ns.n // 60 }} * * *",
    time: "{{ '%02d:%02d' | format(1 + ns.n // 60, ns.n % 60) }}"}
  when: false

source_name:
  type: str
  help: >-
    Human-readable name of the source, at most 77 characters: the generated Python puts
    it on a line, the longest of them http.py's first, which ruff keeps within 100
    columns; no double quote or backslash, since the generated Python quotes it
  placeholder: USDA NASS Quick Stats
  validator: >-
    {% if not source_name %}Required{% elif source_name | length > 77 %}
    At most 77 characters, so every generated Python line stays within 100 columns
    {% elif '"' in source_name or '\\' in source_name %}
    No double quote and no backslash: the generated Python quotes the name
    {% endif %}

upstream_url:
  type: str
  help: The provider's page for this API; linked from the README
  placeholder: https://quickstats.nass.usda.gov
  validator: "{% if not upstream_url.startswith('https://') %}Must start with https://{% endif %}"

upstream_docs_url:
  type: str
  help: Where the API documentation lives; /refresh-upstream snapshots it into docs/upstream/
  placeholder: https://quickstats.nass.usda.gov/api
  validator: "{% if not upstream_docs_url.startswith('https://') %}Must start with https://{% endif %}"

api_base_url:
  type: str
  help: Base URL that request paths are joined onto; usually not the provider page
  placeholder: https://quickstats.nass.usda.gov/api
  validator: "{% if not api_base_url.startswith('https://') %}Required; must start with https://{% endif %}"

# The gateway decides the three key answers below: behind api.data.gov they are derived,
# never asked (ask is false), and still recorded, so the rendered files read them as for
# any keyed source; their validators refuse another value. A `when` would derive them too,
# but copier records no answer of a question whose `when` is false.
gateway:
  type: str
  help: >-
    The shared gateway the API sits behind: api.data.gov for an agency API it fronts
    (USDA FAS's PSD, ESR and GATS), whose key, documented error answers and hourly quota
    come from xippios.core.data_gov, core 0.3.0 on (sdk-core ADR-0032); the key answers then
    follow from it, DATA_GOV_API_KEY in the X-Api-Key header, and are not asked. none, the
    default, for every other API.
  choices:
    - none
    - api.data.gov
  default: none

api_key_env:
  type: str
  help: Environment variable holding the API key, e.g. NASS_API_KEY. Leave empty if the API needs no key.
  default: "{{ 'DATA_GOV_API_KEY' if gateway == 'api.data.gov' else '' }}"  # pragma: allowlist secret
  ask: "{{ gateway == 'none' }}"
  validator: >-
    {% if api_key_env and not (api_key_env | regex_search('^[A-Z][A-Z0-9_]*_API_KEY$')) %}
    Use UPPER_SNAKE_CASE ending in _API_KEY, e.g. NASS_API_KEY
    {% elif gateway == 'api.data.gov' and api_key_env != 'DATA_GOV_API_KEY' %}
    Behind api.data.gov the key is DATA_GOV_API_KEY (sdk-core ADR-0032): leave it to the
    gateway answer
    {% endif %}

api_key_location:
  type: str
  help: How the key is sent
  choices:
    query parameter: query
    request header: header
    bearer token in the Authorization header: bearer
    HTTP basic auth, the key as the user name: basic
  default: "{{ 'header' if gateway == 'api.data.gov' else 'query' }}"
  when: "{{ api_key_env != '' }}"
  ask: "{{ gateway == 'none' }}"
  validator: >-
    {% if gateway == 'api.data.gov' and api_key_location != 'header' %}
    Behind api.data.gov the key goes in a header (sdk-core ADR-0032): leave it to the
    gateway answer
    {% endif %}

api_key_name:
  type: str
  help: Name of the query parameter or header that carries the key
  default: "{{ 'key' if api_key_location == 'query' else 'X-Api-Key' }}"  # pragma: allowlist secret
  when: "{{ api_key_env != '' and api_key_location in ['query', 'header'] }}"
  ask: "{{ gateway == 'none' }}"
  validator: >-
    {% if gateway == 'api.data.gov' and api_key_name != 'X-Api-Key' %}
    Behind api.data.gov the header is X-Api-Key (sdk-core ADR-0032): leave it to the gateway
    answer
    {% endif %}

# The two answers of the package contract's variants (conventions §7 and §8;
# sdk-core ADR-0026, amendment 2026-11-18, points c and d): a write server and a
# multi-tenant source. Names, never switches: write_server renames the entry point, with no
# alias for the old name. Their defaults are literals, so every source that predates them
# takes them on update.
write_server:
  type: bool
  help: >-
    Whether this source writes to the upstream through a server of its own (conventions
    §8): true renders mcp_write.py, which serves tasks_write.__all__ as confirm-gated
    tools, the tasks_write.py scaffold, and the entry points xippios-<slug>-mcp-read and
    xippios-<slug>-mcp-write in place of xippios-<slug>-mcp, with no alias for the old
    name. false, the default, for a read-only source.
  default: false

tenant_param:
  type: str
  help: >-
    The task parameter that names a tenant, for a multi-tenant source whose upstream
    serves each tenant under a credential of its own (conventions §7), e.g. org. It
    renders core's Tenants registry in _client.py, one client per tenant with its
    credential in <PREFIX>_<NAME>_<FIELD>: with api_key_env, its key in
    <PREFIX>_<NAME>_API_KEY, the prefix api_key_env's without _API_KEY; without, the
    variable tenant_credential_env names. The tenants are listed in <PREFIX>_<PARAM>S, and
    the reserved tenant demo, which fixtures and live tests use alone, is declared by its
    own credential; it renders the tenant list task; build(lock) and serve_tenants in
    mcp.py, whose --<param> binds a server to one tenant; and the strip of every other
    tenant's variables in tests/conftest.py. At most 20 characters, so every generated
    Python line stays within 100 columns. Empty, the default, for a source with one tenant.
  default: ""
  validator: >-
    {% if tenant_param and not (tenant_param | regex_search('^[a-z][a-z0-9_]*\\Z')) %}
    A parameter name in lower case, letters, digits and underscores, e.g. org
    {% elif tenant_param | length > 20 %}
    At most 20 characters, so every generated Python line stays within 100 columns
    {% elif tenant_param and gateway != 'none' %}
    A gateway's key serves every package behind it, never one tenant: leave tenant_param empty
    {% endif %}

# The variable that holds each tenant's credential, <PREFIX>_<NAME>_<FIELD> (conventions
# §7): asked of a multi-tenant source without a key alone, whose tenants hold another
# credential, a refresh token say, which its own auth in _client.py reads. A key derives
# it, <PREFIX>_<NAME>_API_KEY from api_key_env, as the gateway derives the key answers; the
# `when` keeps a derived value out of .copier-answers.yml, and the validator refuses one
# given against it.
tenant_credential_env:
  type: str
  help: >-
    The variable that holds each tenant's credential, for a multi-tenant source whose
    tenants hold no API key (conventions §7): <PREFIX>_<NAME>_<FIELD> in upper case, with
    <NAME> as written, e.g. GOOGLE_<NAME>_REFRESH_TOKEN. Core's Tenants takes the prefix
    as its var_prefix and the field as its one field, the reserved tenant demo is declared
    by <PREFIX>_DEMO_<FIELD> alone, and the source's own auth in _client.py reads it. At
    most 40 characters, so every generated Python line stays within 100 columns. A source
    whose tenants hold a key answers api_key_env instead, which derives
    <PREFIX>_<NAME>_API_KEY and renders the key's auth.
  default: "{{ api_key_env[:-8] ~ '_<NAME>_API_KEY' if tenant_param and api_key_env else '' }}"
  when: "{{ tenant_param != '' and api_key_env == '' }}"
  validator: >-
    {% set derived = api_key_env[:-8] ~ '_<NAME>_API_KEY' if tenant_param and api_key_env else '' %}
    {% if tenant_param and not api_key_env %}
    {% if not tenant_credential_env %}
    Required for a multi-tenant source without api_key_env, e.g. GOOGLE_<NAME>_REFRESH_TOKEN
    {% elif not (tenant_credential_env | regex_search('^[A-Z][A-Z0-9_]*_<NAME>_[A-Z][A-Z0-9_]*\\Z')) %}
    <PREFIX>_<NAME>_<FIELD> in upper case, <NAME> as written, e.g. GOOGLE_<NAME>_REFRESH_TOKEN
    {% elif tenant_credential_env.endswith('_API_KEY') %}
    A key: answer api_key_env, which renders its auth and derives <PREFIX>_<NAME>_API_KEY
    {% elif tenant_credential_env | length > 40 %}
    At most 40 characters, so every generated Python line stays within 100 columns
    {% endif %}
    {% elif tenant_credential_env != derived %}
    Leave it out: a key derives it from api_key_env, and a source with one tenant has none
    {% endif %}

# A multi-tenant source's variables (conventions §7), derived from tenant_credential_env and
# tenant_param, never asked: the prefix of every tenant's variables, the field core's
# Tenants takes, and the variable that lists the tenants. Computed, never recorded.
tenant_prefix:
  type: str
  default: "{{ tenant_credential_env.split('_<NAME>_')[0] if tenant_param else '' }}"
  when: false

tenant_field:
  type: str
  default: "{{ tenant_credential_env.split('_<NAME>_')[1] if tenant_param else '' }}"
  when: false

tenant_list_var:
  type: str
  default: "{{ tenant_prefix ~ '_' ~ (tenant_param | upper) ~ 'S' if tenant_param else '' }}"
  when: false

rate_limit_per_minute:
  type: int
  help: >-
    The pace in requests per minute, enforced client-side: the upstream's documented
    per-minute limit (or its per-second limit times 60), a pace set under that limit on
    evidence, such as recorded refusals or a limit stated in another unit than requests,
    or, where upstream documents no per-second or per-minute limit, a self-imposed pace, an
    hourly or daily quota notwithstanding (sdk-core ADR-0033 decision 1)
  default: 60
  validator: "{% if rate_limit_per_minute < 1 %}Must be at least 1{% endif %}"

rate_limit_burst:
  type: int
  help: >-
    Requests the limiter lets through at once before it paces them. 1 unless the
    upstream documents a burst (sdk-core ADR-0033 decision 1)
  default: 1
  validator: "{% if rate_limit_burst < 1 %}Must be at least 1{% endif %}"

rate_limit_provenance:
  type: str
  help: Where the pace comes from; the generated CLAUDE.md names it (sdk-core ADR-0033 decision 1)
  choices:
    documented by upstream: documented
    set under a limit upstream documents, CLAUDE.md giving both: below-documented
    self-imposed, upstream documents no per-second or per-minute limit: self-imposed
  default: documented

core_version:
  type: str
  help: >-
    The xippios-core release the package depends on, X.Y.Z, rendered as the bound
    xippios-core~=X.Y.Z, the extras likewise: one core minor, from that release on, Z 0
    unless patch Z shipped what the source adopts (conventions §12, sdk-core ADR-0039
    decision 1). The default 0.4.1, the core release the template adopts, renders
    xippios-core~=0.4.1. A source raises it in the adoption PR of a new core minor
    (conventions §15).
  default: "0.4.1"
  validator: >-
    {% if not (core_version | regex_search('^\\d+\\.\\d+\\.\\d+\\Z')) %}
    Use a release version, e.g. 0.2.0
    {% elif gateway == 'api.data.gov' and (core_version.split('.')[:2] | map('int') | list) < [0, 3] %}
    Behind api.data.gov use 0.3.0 or later: core 0.3.0 brought xippios.core.data_gov
    {% endif %}

core_git_ref:
  type: str
  help: >-
    Development only. The sdk-core commit to depend on for a core change that is not
    released yet: main, or the full 40-character SHA of a commit on main, which uv reads
    as that commit. Leave it empty, the default, for no pin; a release carries none
    (/release-prep removes it first, in a PR of its own).
  default: ""
  validator: >-
    {% if core_git_ref and not (core_git_ref | regex_search('^(main|[0-9a-f]{40})\\Z')) %}
    Use main or a full 40-character lowercase commit SHA of sdk-core, or leave it empty
    {% endif %}

# A string holding a YAML flow list, not a yaml-typed answer: copier records a string on
# one line, '[]' at the default, where a list would be recorded as [] or as block lines at
# column 0. depends_on below is the parsed list.
source_dependencies:
  type: str
  help: >-
    The source packages this one depends on, using their task layer only
    (sdk-core ADR-0021): a YAML flow list of {name: <slug>, minor: "X.Y", key_env: <VAR or
    "">} entries, e.g. [{name: usda-esmis, minor: "0.1", key_env: ""}]. name is the
    dependency's slug, its package xippios-<slug>, imported under xippios as that package's
    import path; minor, in quotes, is the minor depended on, rendered as the bound
    xippios-<slug>~=X.Y.0 (conventions §12); key_env is the dependency's key variable, empty
    for an open API, which the offline tests set to the placeholder and live.yml passes from
    its org secret. One level, no cycles: a dependency depends on no other source. The
    default [] for none.
  default: "[]"
  validator: >-
    {% set deps = source_dependencies | from_yaml %}
    {% set ns = namespace(error='', seen=[]) %}
    {% if deps is string or deps is mapping or deps is not sequence %}
    {% set ns.error = 'A YAML flow list, e.g. [{name: usda-esmis, minor: "0.1", key_env: ""}], or [] for none' %}
    {% else %}
    {% for dep in deps %}
    {% if ns.error %}
    {% elif dep is not mapping or dep | list | sort != ['key_env', 'minor', 'name'] %}
    {% set ns.error = 'Each entry has exactly name, minor and key_env' %}
    {% elif dep['name'] is not string or not (dep['name'] | regex_search('^[a-z0-9]+(-[a-z0-9]+)*\\Z')) %}
    {% set ns.error = 'name: the dependency slug, lowercase letters, digits and single hyphens' %}
    {% elif dep['name'] in [source_slug, 'core'] or dep['name'] in ns.seen %}
    {% set ns.error = 'name: another source, each once; neither this source nor core' %}
    {% elif dep['minor'] is not string or not (dep['minor'] | regex_search('^\\d+\\.\\d+\\Z')) %}
    {% set ns.error = 'minor: X.Y in quotes, e.g. "0.1"; YAML reads 0.10 unquoted as the number 0.1' %}
    {% elif dep['key_env'] is not string or (dep['key_env'] and not (dep['key_env'] | regex_search('^[A-Z][A-Z0-9_]*_API_KEY\\Z'))) %}
    {% set ns.error = 'key_env: UPPER_SNAKE_CASE ending in _API_KEY, or "" for an open API' %}
    {% else %}
    {% set ns.seen = ns.seen + [dep['name']] %}
    {% endif %}
    {% endfor %}
    {% endif %}
    {{ ns.error }}

# The dependencies as a list, parsed from the answer; the rendered files read this.
depends_on:
  type: yaml
  default: "{{ source_dependencies }}"
  when: false

# Every key variable the package's tests and live run need, the source's own first, then
# its dependencies', each once: the placeholder in offline tests, the secrets in live.yml.
# A multi-tenant source's own is the reserved tenant's credential, its key or the field
# tenant_credential_env names, the one its tests and live run read, which alone declares
# that tenant offline.
key_envs:
  type: yaml
  default: >-
    {{ ((([tenant_prefix ~ '_DEMO_' ~ tenant_field] if tenant_param else [api_key_env] if api_key_env
    else []) + depends_on | map(attribute='key_env') | select | list) | unique | list) | tojson }}
  when: false

# The variables the live tests read beyond the keys, each passed to live.yml's pytest step
# from the secret of the same name. A string holding a YAML flow list, as
# source_dependencies, so copier records it on one line, '[]' at the default.
# live_secret_names is the parsed list.
live_secrets:
  type: str
  help: >-
    The variables the live tests read beyond the keys, such as a username and a password
    or an OAuth client's pair: a YAML flow list of UPPER_SNAKE_CASE names, e.g.
    [FAOSTAT_USERNAME, FAOSTAT_PASSWORD]. live.yml passes each one to its pytest step
    from the secret of the same name, after the keys. A multi-tenant source without a
    key names each under xippios_placeholder_key_envs too, after the reserved tenant's
    credential, since its own auth reads them. A key is api_key_env's or a dependency's
    key_env, never one of these. The default [] for none.
  default: "[]"
  validator: >-
    {% set names = live_secrets | from_yaml %}
    {% set ns = namespace(error='', seen=[]) %}
    {% if names is string or names is mapping or names is not sequence %}
    {% set ns.error = 'A YAML flow list of variable names, e.g. [EXAMPLE_USERNAME, EXAMPLE_TOKEN], or [] for none' %}
    {% else %}
    {% for name in names %}
    {% if ns.error %}
    {% elif name is not string or not (name | regex_search('^[A-Z][A-Z0-9_]*\\Z')) %}
    {% set ns.error = 'Each name UPPER_SNAKE_CASE, e.g. EXAMPLE_USERNAME' %}
    {% elif name.startswith('GITHUB_') or name == 'XIPPIOS_LIVE_TESTS' %}
    {% set ns.error = name ~ ': GitHub takes no secret named GITHUB_*, and the step sets XIPPIOS_LIVE_TESTS itself' %}
    {% elif name in key_envs %}
    {% set ns.error = name ~ ": a key, or the reserved tenant's credential, which live.yml passes already" %}
    {% elif name in ns.seen %}
    {% set ns.error = name ~ ': each name once' %}
    {% else %}
    {% set ns.seen = ns.seen + [name] %}
    {% endif %}
    {% endfor %}
    {% endif %}
    {{ ns.error }}

# The live secrets as a list, parsed from the answer; live.yml reads this.
live_secret_names:
  type: yaml
  default: "{{ live_secrets }}"
  when: false

# The variables the package reads, as the package contract lists them (conventions §7;
# sdk-core ADR-0026, amendment 2026-11-18, point c): the source's key, or a multi-tenant
# source's tenant list and the pattern of its tenants' credential, then its dependencies'
# keys and the live secrets, each once, each secret and required but the tenant list.
# _client.py renders ENV_VARS from it and the README its variables. Computed, never
# recorded.
env_vars:
  type: yaml
  default: >-
    {%- set ns = namespace(vars=[]) -%}
    {%- if tenant_param -%}
    {%- set ns.vars = [{'name': tenant_list_var, 'secret': false, 'required': false},
    {'name': tenant_credential_env, 'secret': true, 'required': true}] -%}
    {%- elif api_key_env -%}
    {%- set ns.vars = [{'name': api_key_env, 'secret': true, 'required': true}] -%}
    {%- endif -%}
    {%- for name in (depends_on | map(attribute='key_env') | select | list) + live_secret_names -%}
    {%- if name not in (ns.vars | map(attribute='name') | list) -%}
    {%- set ns.vars = ns.vars + [{'name': name, 'secret': true, 'required': true}] -%}
    {%- endif -%}
    {%- endfor -%}
    {{ ns.vars | tojson }}
  when: false

# Whether the source parses the files it downloads (sdk-core ADR-0020): parse/, the samples'
# provenance table and the .gitattributes line that keeps the samples render only then.
# Its default, false, is a literal, so every source that predates the question takes it on
# update.
has_files:
  type: bool
  help: >-
    Whether this source parses files it downloads (sdk-core ADR-0020). A source that parses
    files answers true: parse/ renders, one module per file kind, and
    tests/fixtures/files/README.md, one provenance row per sample file its parser tests
    read, and .gitattributes keeps tests/fixtures/files/ byte for byte. A retrieval-only
    source, which lists releases and downloads files without parsing them, answers false:
    its download fixture is the recorded exchange of the file's URL (sdk-core ADR-0040
    decision 5). false, the default, for an API that answers with records.
  default: false

# Whether the source packages reference data (conventions §3): params.py, enums.py,
# reference/, scripts/refresh_reference.py and /refresh-reference-data render only then,
# so an update brings none of them back to a source that packages none. Its default, true,
# is a literal, so every source that predates the question takes it on update.
has_reference_data:
  type: bool
  help: >-
    Whether this source packages reference data (conventions §3): code lists or tables
    that upstream publishes for every caller alike, fetched by
    scripts/refresh_reference.py into reference/ and rendered into enums.py. true, the
    default, renders that scaffold, params.py, enums.py, reference/,
    scripts/refresh_reference.py and /refresh-reference-data, whether or not a list is
    packaged yet. A source that packages none answers false: none of it renders, and an
    update deletes the files the template rendered, the source's lines in them included,
    and leaves a file the source added under reference/ for the source to delete.
  default: true

# The human's GitHub login, which the rendered .github/CODEOWNERS names as the owner of the
# paths that steer the repository. Its default is a literal, so every source that predates
# the question takes it on update.
human:
  type: str
  help: >-
    The GitHub login of the human, without the @: .github/CODEOWNERS names it as the
    owner of the paths that steer the repository, .github/, CLAUDE.md, .claude/,
    pyproject.toml and .copier-answers.yml, so a change to one waits for that human's
    review. jdidaskalu, the default.
  default: jdidaskalu
  validator: >-
    {% if not (human | regex_search('^[A-Za-z0-9]+(-[A-Za-z0-9]+)*\\Z')) or human | length > 39 %}
    A GitHub login without the @: letters, digits and single hyphens, at most 39 characters
    {% endif %}

# 9.19.0 brought `ask`, which the key answers take behind a gateway.
_min_copier_version: "9.19.0"
_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_envops:
  trim_blocks: true
  lstrip_blocks: true
# Files a source fills with its own content: never overwritten by `copier update`.
# Every other rendered file is the template's and updates with it, the commands under
# .claude/commands/, tests/conftest.py and tests/test_family.py among them. Copier renders these
# patterns, so those inside the package name its directory: src/xippios/**/api/** would
# also match the whole package of a slug ending in -api (example-api's xippios/example/api/).
# They read as gitignore lines, so /README.md is the source's README at the root alone:
# README.md would match changelog/README.md too, which every source shares.
# scripts/ names the two scripts a source fills: scripts/adr_index.py and the two release
# scripts are the template's, and a script of the source's own is never rendered, so no
# update touches it. The ADR index is the source's, generated from its records by
# scripts/adr_index.py, which writes it again.
_skip_if_exists:
  - src/xippios/{{ package_dir }}/__init__.py
  - src/xippios/{{ package_dir }}/_client.py
  - src/xippios/{{ package_dir }}/errors.py
  - src/xippios/{{ package_dir }}/models.py
  - src/xippios/{{ package_dir }}/api/**
