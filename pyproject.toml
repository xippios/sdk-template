# sdk-template is not a Python package: this file holds the development tooling for the
# template itself (copier, the template tests, ruff for scripts and tests, detect-secrets
# for the test that scans a rendered core pin).
[project]
name = "sdk-template"
version = "0.1.0"
description = "Copier template for xippios-<source> SDK repositories"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "copier>=9.4",
  "pytest>=8",
  "ruff>=0.14",
  "pyyaml>=6",
  "detect-secrets>=1.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["template"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF", "PTH", "PT", "C4"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
