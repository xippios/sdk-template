# The org ruleset requires a check named `ci` on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      # The three shapes of the family's sources, each rendered and checked end to end
      # (T11): inside the required job, so a failing proof blocks the merge.
      - name: Prove the template, keyed and nested (sdk-example-api)
        run: scripts/prove.sh
      - name: Prove the template, keyless and flat (sdk-example, as eurostat)
        run: scripts/prove.sh --keyless
      - name: Prove the template, keyless and nested (sdk-example-files, as esmis or wasde)
        run: scripts/prove.sh --keyless-nested
